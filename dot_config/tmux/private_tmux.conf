# Kun Chen-style tmux: tabs across the top, status in tab titles, keyboard-driven
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Prefix to Ctrl+a (easier than Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Index from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse on, but stay keyboard first
set -g mouse on

# Pane splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window navigation
bind -r C-h previous-window
bind -r C-l next-window

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Status: minimal bottom bar + tab title shows current agent/tool status
set -g status on
set -g status-position top
set -g status-interval 1
set -g status-left-length 60
set -g status-right-length 120
set -g status-left "#[fg=green,bold]#S #[default]| "
set -g status-right "#[fg=cyan]%H:%M#[default] | #[fg=yellow]#(whoami)@#h"
set -g window-status-format "#I:#W"
set -g window-status-current-format "#[fg=black,bg=cyan,bold]#I:#W#[default]"
set -g status-style bg=black,fg=white

# Window titles (for agent status plugins)
set -g set-titles on
set -g set-titles-string "#{pane_title}"

# Synchronize title from applications (e.g. Claude Code / no-mistakes)
setw -g allow-rename on
setw -g automatic-rename on
setw -g automatic-rename-format "#{pane_title}"

# Scrollback
set -g history-limit 100000

# Copy mode vi
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Quick reload
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
